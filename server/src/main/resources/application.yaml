ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - cloud.larn.knowledge.server.ApplicationKt.module

knowledge:
  # Comma-separated hostnames accepted in the Host header of /mcp requests (DNS-rebinding protection).
  allowedHosts: "$ALLOWED_HOSTS:localhost,127.0.0.1,[::1]"
